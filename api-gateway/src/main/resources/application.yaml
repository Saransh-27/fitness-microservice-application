spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webflux:
          routes:
            # User Microservice Route
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/apis/users/**

            # Fitness Activity Microservice Route
            - id: activity-service
              uri: lb://ACTIVITY-SERVICE
              predicates:
                - Path=/apis/activities/**

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: TRACE
    reactor.netty.http.client: DEBUG
